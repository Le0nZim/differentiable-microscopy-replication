# Figure 4 task-aware segmentation — isolated verified re-run (BBBC022 proxy).
#
# Same faithful three-stage procedure as configs/task_aware/
# bbbc022_segmentation_task_aware.yaml (paper §5.3 / A.2.3 / B.0.1), with ONE
# deliberate change for this isolated fix: Stage 1 (content-aware pretrain) is
# REUSED from the frozen am2_task_aware_full checkpoints via stage1_mode=load,
# instead of being retrained. B.0.1 step 1 is "train the end-to-end model for
# content-aware"; reusing that already-trained model (produced by the identical
# code/config/seed) is faithful and avoids redundant compute — exactly as the
# Figure 3 SwinIR fix reused the frozen content-aware base. The runner
# (scripts/fig4_seg_fix_train.py) fills content_aware_checkpoint per cell and
# deep-merges the {x64,x256,x1024} x {fixed,learnable} matrix. Values below are
# the x64 learnable template. This is a BBBC022 Hoechst SUBSTITUTE proxy (not
# U2OS); absolute metrics are not comparable to the paper.

experiment:
  seed: 42
  device: cuda:0
  study_label: "Fig4 task-aware segmentation fix (BBBC022 proxy; Stage-1 reused frozen)"
  results_csv: experiments/figure4_bbbc022_segmentation_fix_v1/runs/stage1_results.csv
  run_id: taskaware_x64_learnable_frequency
  output_dir: experiments/figure4_bbbc022_segmentation_fix_v1/runs/taskaware_x64_learnable_frequency_seed42

dataset:
  name: bbbc022_hoechst
  data_root: data/substitute_data
  stack_glob: "**/*.tif"
  preprocessing_mode: paper_strict
  bias: 134.28
  clip_max: 500.0
  downscale_factor: 1.0
  background_percentile: 1.0
  clip_percentile: 99.9
  patch_size: 256
  image_size: 256
  num_train_images: 168
  num_val_images: 21
  num_test_images: 21
  seed: 42
  train_random_crops: true
  random_flips: true
  split_by_well: true
  return_mask: true
  # Pseudo-ground-truth mask generation.
  #   mask_mode: trackmate  -> TrackMate-style detection on the RAW MIP intensity:
  #     classify pixels with intensity > mask_raw_threshold as foreground, group
  #     with 4-connectivity, resample each region contour at ~mask_smooth_interval
  #     px, Douglas-Peucker simplify (mask_dp_epsilon), then fill. No extra
  #     normalization or morphological post-processing.
  #   mask_mode: threshold_closing -> legacy A.2.3 recipe (normalize->thr 0.3->close 10).
  mask_mode: trackmate
  mask_raw_threshold: 506.0
  mask_smooth_interval: 2.0
  mask_dp_epsilon: 0.5
  # Legacy threshold_closing params (kept for provenance / fallback).
  mask_threshold: 0.3
  mask_closing_kernel: 10

pattern_generator:
  mode: learnable_frequency        # overridden to random_fixed for the fixed cells
  num_patterns: 4                  # T (compression = downscale^2 / T)
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42

sigmoid_schedule:
  epoch_baseline: 0
  epoch_cutoff: 0
  epoch_step: 1
  m_init: 1.0

forward_model:
  downscale_factor: 16             # x64 (16^2/4). 32 -> x256, 64 -> x1024
  use_impulse_psfs: true
  ex_psf_kernel_size: 3
  em_psf_kernel_size: 3

detector_noise:
  mode: noise_free
  photon_count: 10000.0
  gamma: 10.0
  sigma_read: 0.0
  apply_noise: false

inverse_model:
  upsampling:
    mode: locality_aware
    downscale_factor: 16
    num_patterns: 4
    use_mixing_cnn: false
    mixing_hidden_channels: 16
  reconstruction:
    in_channels: 4
    hidden_channels: [64, 64, 32, 32, 16, 1]
    kernel_size: 3
    padding: 1

segmentation_head:
  in_channels: 1
  hidden_channels: [16, 16, 1]
  kernel_size: 3
  padding: 1

training:
  batch_size: 32
  log_every: 200
  illumination_lr: 1.0
  inverse_lr: 0.001
  gradient_clip_norm: 1.0
  sharpen_eval_m: 10.0
  loss: l1
  learn_patterns: true             # overridden to false for the fixed cells
  fixed_sigmoid_m: 1.0

  seg_bce_weight: 1.0              # main BCEWithLogits task loss
  seg_dice_weight: 0.5            # auxiliary soft-Dice
  reconstruction_l1_weight: 0.0

  task_aware:
    stage1_mode: load              # REUSE frozen content-aware base (set per cell by runner)
    content_aware_checkpoint: null # runner fills with am2 Stage-1 best.pt per cell
    eval_sigmoid_m: 10.0
    finetune_sigmoid_m: 1.0
    finetune_harden_m_values: [2.0, 4.0, 8.0]
    finetune_soft_fraction: 0.6
    seg_head_lr: 0.001
    num_qualitative_samples: 6
    # Stage 1 kept for provenance; unused when stage1_mode=load.
    stage1:
      learnable:
        inverse_warmup_steps: 1500
        joint_soft_steps: 3500
        harden_m_values: [2, 4, 8]
        harden_steps_per_m: 800
      fixed_steps: 4000
    # Stage 2: segmentation-head-only (microscope frozen)
    seg_head_steps: 1200
    # Stage 3: end-to-end task-aware finetuning
    finetune_steps: 2500
