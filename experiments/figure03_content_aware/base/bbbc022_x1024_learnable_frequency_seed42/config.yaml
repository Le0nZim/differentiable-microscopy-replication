experiment:
  seed: 42
  device: cuda:0
  study_label: BBBC022 Hoechst substitute U2OS-style experiments
  results_csv: experiments/ablations/results.csv
  compression: 1024.0
  run_id: bbbc022_x1024_learnable_frequency
dataset:
  name: bbbc022_preproc_ablation
  data_root: data/substitute_data
  stack_glob: '**/*.tif'
  preprocessing_mode: paper_strict
  bias: 134.28
  clip_max: 500.0
  downscale_factor: 1.0
  background_percentile: 1.0
  clip_percentile: 99.9
  patch_size: 256
  image_size: 256
  num_train_images: 168
  num_val_images: 21
  num_test_images: 21
  seed: 42
  train_random_crops: true
  random_flips: true
  split_by_well: true
  return_mask: false
  split_path: configs/_shared/splits/split_fig03_large.json
  repo_root: .
  preproc_mode: minimal_percentile
  q_low: 0.001
  q_high: 0.999
  epoch_varying_train_crops: true
pattern_generator:
  mode: learnable_frequency
  num_patterns: 4
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42
  height: 256
  width: 256
sigmoid_schedule:
  epoch_baseline: 0
  epoch_cutoff: 0
  epoch_step: 1
  m_init: 1.0
forward_model:
  downscale_factor: 64
  use_impulse_psfs: true
  ex_psf_kernel_size: 3
  em_psf_kernel_size: 3
detector_noise:
  mode: noise_free
  photon_count: 10000.0
  gamma: 10.0
  sigma_read: 0.0
  apply_noise: false
inverse_model:
  upsampling:
    mode: locality_aware
    downscale_factor: 64
    num_patterns: 4
    use_mixing_cnn: false
    mixing_hidden_channels: 16
  reconstruction:
    in_channels: 4
    hidden_channels:
    - 64
    - 64
    - 32
    - 32
    - 16
    - 1
    kernel_size: 3
    padding: 1
training:
  batch_size: 32
  log_every: 200
  illumination_lr: 1.0
  inverse_lr: 0.001
  gradient_clip_norm: 1.0
  sharpen_eval_m: 10.0
  loss: l1
  learn_patterns: true
  fixed_sigmoid_m: 1.0
  staged_hardening:
    inverse_warmup_steps: 1500
    joint_soft_steps: 5000
    harden_m_values:
    - 2
    - 4
    - 8
    harden_steps_per_m: 1200
  num_epochs: 1
  use_staged_hardening: true
