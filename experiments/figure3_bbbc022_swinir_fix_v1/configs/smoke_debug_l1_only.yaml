# Fig-3 SwinIR refinement stage — SMOKE / DEBUG ONLY (do NOT cite as a result).
#
# A small SwinIR + short run to prove the pipeline end-to-end (cache -> train ->
# select -> eval -> grids). Explicitly a smoke test per the task spec.

name: smoke_debug_l1_only
base_exp_root: experiments/ablations/bbbc022_content_aware_v2
seed: 42

swinir:
  profile: smoke_debug
  upscale: 1
  in_chans: 1
  window_size: 8
  embed_dim: 60
  depths: [2, 2]
  num_heads: [2, 2]
  mlp_ratio: 2
  resi_connection: "1conv"
  img_range: 1.0
  upsampler: ""

train:
  train_patch_size: 64
  cache_crops_per_train_image: 1
  micro_batch_size: 16
  grad_accum: 1
  effective_batch_size: 16
  iterations: 600
  swinir_lr: 0.0002
  betas: [0.9, 0.99]
  warmup: 50
  min_lr_frac: 0.05
  grad_clip: 1.0
  amp_dtype: bfloat16
  random_flips: true
  base_batch: 8
  log_every: 50
  val_every: 150
  ckpt_every: 300

loss:
  mode: l1_only

selection:
  primary: ssim
  mse_no_regression_gate: true

eval:
  eval_batch: 16
