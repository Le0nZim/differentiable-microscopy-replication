[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-microscopy-replication"
version = "0.1.0"
description = "Reproduction of Differentiable Microscopy for compressive fluorescence imaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "tifffile>=2023.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "timm>=0.6",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running integration tests",
]
