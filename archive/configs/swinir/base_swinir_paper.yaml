# Paper-aligned SwinIR base (partial — see SWINIR_PAPER_ALIGNMENT_PLAN.md)
task: classical_sr_with_learnable_illumination
paper_section: "5.6"

model:
  upscale: 1
  in_chans: 1
  img_size: 64
  window_size: 8
  upsampler: ""
  architecture_source: vendor_default_unless_paper_specifies

training:
  losses:
    pixel: PAPER_SPECIFIED
    adversarial: PAPER_SPECIFIED
    perceptual: PAPER_SPECIFIED
  illumination_lr: 0.1
  compression: 16
  patch_size: 64
  optimizer_swinir_body: PAPER_UNSPECIFIED

data:
  train:
    - data/sr/train/DIV2K/HR
    - data/sr/train/Flickr2K/HR
  test:
    - data/sr/test/Set5/HR
    - data/sr/test/Set14/HR
    - data/sr/test/BSD100/HR
    - data/sr/test/Urban100/HR
    - data/sr/test/Manga109/HR
