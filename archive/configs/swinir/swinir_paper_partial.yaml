# SwinIR paper partial run — subset training, not Table 2
# Paper Sec 5.6: full run needs LI + x16 + adv/perceptual losses

experiment:
  seed: 42
  device: cuda:1
  run_id: swinir_paper_partial
  label: partial vendor-baseline; not paper Table 2

data:
  train:
    - data/sr/train/DIV2K/HR
    - data/sr/train/Flickr2K/HR
  test:
    - data/sr/test/Set5/HR
  train_per_dataset: 32
  test_max_images: 5

model:
  upscale: 1
  in_chans: 1
  img_size: 64
  window_size: 8
  upsampler: ""

training:
  steps: 150
  batch_size: 4
  optimizer: adam
  lr: 2.0e-4
  loss: l1
  degradation: bicubic_down_up_proxy  # PAPER_UNSPECIFIED for partial

evaluation:
  metrics: [psnr, ssim]
