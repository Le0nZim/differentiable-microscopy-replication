# AM-4 — Paper-faithful SwinIR Table-2 rerun (full capacity).
#
# Source-of-truth order: (1) paper §5.6/§4.4.3/Table 2, (2) vendored SwinIR
# (replication/SwinIR: network_swinir.py, main_test_swinir.py, README l.175),
# (3) repo conventions, (4) labelled assumptions.
#
# This config removes the AM-4 concrete deviations of the frozen run:
#   embed_dim 96 -> 180 (SwinIR-M), batch 16 -> effective 32 (grad accum),
#   8000 iters -> ~paper/SwinIR-scale schedule, capped center-biased tiled eval
#   -> fair full deterministic tiling.
#
# Run:  scripts/table02_swinir_sr/run.py --config archive/configs/swinir/am4_table2_full.yaml
# NOTE: a full ~5e5-iter SwinIR schedule x2 conditions is multi-GPU-day; see
# experiments/.../am4_swinir_table2_resolution/COMPUTE_LIMITED_STATUS.md.

experiment:
  seed: 42
  device: auto                # auto picks the freest visible CUDA device, else cpu
  tag: full

data:
  train_roots:
    - data/sr/train/DIV2K/HR
    - data/sr/train/Flickr2K/HR
  test_roots:
    Set5: data/sr/test/Set5/HR
    Set14: data/sr/test/Set14/HR
    BSD100: data/sr/test/BSD100/HR
    Urban100: data/sr/test/Urban100/HR
    Manga109: data/sr/test/Manga109/HR
  patch_size: 64              # paper: 64x64 patches
  grayscale: true            # paper: classical grayscale SR task (l.226)
  val_fraction: 0.02         # held-out train images for best-val selection
  max_train_images: null     # all
  max_test_images: null      # all (fair full eval)

model:
  image_size: 64
  compression: 16            # paper: x16
  downscale_factor: 8        # d=8, T=4 -> d^2/T = 16
  num_patterns: 4
  swinir:                    # "similar to SwinIR configurations [26]" = SwinIR-M
    upscale: 1               # paper: "upscaling factor of the SwinIR to 1"
    in_chans: 1              # grayscale microscopy forward model
    img_size: 64
    window_size: 8           # SwinIR default
    upsampler: ""            # upscale=1 -> image-to-image (denoising-style)
    embed_dim: 180           # SwinIR-M (vendored main_test_swinir.py); was 96
    depths: [6, 6, 6, 6, 6, 6]
    num_heads: [6, 6, 6, 6, 6, 6]
    mlp_ratio: 2
    resi_connection: "1conv"
    img_range: 1.0

training:
  iterations: 500000         # SwinIR README l.175 (batch=32, iter=500k); compute-bound
  effective_batch_size: 32   # paper §4.4.3
  micro_batch_size: 8        # fits ~18GB; raise if a GPU is dedicated
  grad_accum: 4              # 8*4 = 32 effective
  illumination_lr: 0.1       # paper §5.6 explicit
  swinir_lr: 0.0002          # ASSUMPTION: SwinIR convention (paper "similar to SwinIR")
  disc_lr: 0.0002            # ASSUMPTION
  betas: [0.9, 0.99]         # ASSUMPTION (ESRGAN/SwinIR)
  amp_dtype: bfloat16        # bf16 (no GradScaler; illumination W is complex)
  random_fixed_m: 10.0
  train_sigmoid_m: 8.0       # ASSUMPTION (Algorithm-1 schedule given only for MCF7/U2OS)
  eval_sigmoid_m: 8.0
  num_workers: 8
  log_every: 100
  val_every: 5000
  ckpt_every: 10000
  loss:
    pixel_weight: 1.0        # paper: pixel loss
    pixel_kind: l1
    perceptual_weight: 1.0   # paper: perceptual loss (ESRGAN weight ASSUMPTION)
    gan_weight: 0.1          # paper: adversarial loss (ESRGAN weight ASSUMPTION)
    gan_type: vanilla
  conditions:
    - name: swinir_wo_li
      learnable: false
    - name: swinir_with_li
      learnable: true

eval:
  tile_selection: all        # fair: every non-overlapping 64x64 tile
  max_tiles_per_image: null  # no cap
  eval_batch: 64
  stitched: true             # also report stitched full-image PSNR/SSIM

# For the FULL config this list contains ONLY unavoidable paper-unspecified
# assumptions (NOT concrete deviations — those are now fixed). See AM4_source_audit.md.
deviations_from_paper:
  - "ASSUMPTION swinir_lr=2e-4 (paper §5.6 'similar to SwinIR' overrides §4.4.3 CNN default 1e-3)"
  - "ASSUMPTION discriminator = compact spectral-norm VGG-style (paper 'similar to SwinIR'; arch unspecified)"
  - "ASSUMPTION VGG19 perceptual layers conv1_2..conv5_4 + ESRGAN weights (unspecified)"
  - "ASSUMPTION loss weights pixel 1.0 / perceptual 1.0 / gan 0.1 (ESRGAN default; unspecified)"
  - "ASSUMPTION betas (0.9,0.99), no LR schedule/warmup (SwinIR/ESRGAN convention; unspecified)"
  - "ASSUMPTION d=8,T=4 factorisation of x16 (paper states x16, not the d/T split)"
  - "ASSUMPTION train sigmoid sharpness m=8 fixed (Algorithm-1 m schedule only given for MCF7/U2OS)"
  - "ARCH-UNAVOIDABLE tiled 64x64 eval (locality-aware upsampling is built for fixed 64x64 input; full-image single pass not possible). Cap + center-bias REMOVED (fair full tiling)."
  - "COMPUTE: faithful schedule is ~5e5 iters x2 conditions (~GPU-days); see COMPUTE_LIMITED_STATUS.md for the actual iters reached + resume command"
