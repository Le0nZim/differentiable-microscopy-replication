# BBBC022 Hoechst substitute U2OS-style base config (NOT paper U2OS reproduction).

experiment:
  seed: 42
  device: cuda:1
  study_label: "BBBC022 Hoechst substitute U2OS-style experiments"
  results_csv: experiments/ablations/results.csv

dataset:
  name: bbbc022_hoechst
  data_root: data/substitute_data
  stack_glob: "**/*.tif"
  preprocessing_mode: paper_strict
  bias: 134.28
  clip_max: 500.0
  downscale_factor: 1.0
  background_percentile: 1.0
  clip_percentile: 99.9
  patch_size: 256
  image_size: 256
  num_train_images: 168
  num_val_images: 21
  num_test_images: 21
  seed: 42
  train_random_crops: true
  random_flips: true
  split_by_well: true
  return_mask: false

pattern_generator:
  mode: learnable_frequency
  num_patterns: 4
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42

sigmoid_schedule:
  epoch_baseline: 0
  epoch_cutoff: 0
  epoch_step: 1
  m_init: 1.0

forward_model:
  downscale_factor: 8
  use_impulse_psfs: true
  ex_psf_kernel_size: 3
  em_psf_kernel_size: 3

detector_noise:
  mode: noise_free
  photon_count: 10000.0
  gamma: 10.0
  sigma_read: 0.0
  apply_noise: false

inverse_model:
  upsampling:
    mode: locality_aware
    downscale_factor: 8
    num_patterns: 4
    use_mixing_cnn: false
    mixing_hidden_channels: 16
  reconstruction:
    in_channels: 4
    hidden_channels: [64, 64, 32, 32, 16, 1]
    kernel_size: 3
    padding: 1

training:
  batch_size: 32
  log_every: 200
  illumination_lr: 1.0
  inverse_lr: 0.001
  gradient_clip_norm: 1.0
  sharpen_eval_m: 10.0
  loss: l1
  learn_patterns: true
  max_steps: 4000
  fixed_sigmoid_m: 1.0
  staged_hardening:
    inverse_warmup_steps: 1500
    joint_soft_steps: 4000
    harden_m_values: [2, 4, 8]
    harden_steps_per_m: 1000
