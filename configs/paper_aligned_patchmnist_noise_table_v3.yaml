# Paper-aligned PatchMNIST noise Table 1 with CORRECTED supplement A.2.2 noise (RR-1 v3 / AM-1).
#
# Identical to paper_aligned_patchmnist_noise_table_normalized.yaml (v2) EXCEPT
# detector_noise.noise_normalization: paper_v3 (was: paper).
#
# v2 ("paper")   : alpha_norm = alpha_down / d²   -> over-normalizes signal to [0, 1].
# v3 ("paper_v3"): alpha_norm = alpha_down        -> faithful to eq. S5, because the
#                  repo forward model already outputs alpha_down^norm = ψ(X, H_t^norm)
#                  with binary patterns ∈ {0,1} and image ∈ [0,1] (sum-pool, range [0, d²]).
# All other hyper-parameters are kept identical to v2 so any change in Table 1 is
# attributable solely to the noise-normalization fix (not to a different recipe).

experiment:
  seed: 42
  device: cuda:0
  alignment_mode: paper
  checkpoint_policy: best_val
  checkpoint_policy_note: "best_val is an implementation choice"
  results_csv: experiments/noise_robustness/rr1_v3_normalized_full/results.csv

dataset:
  name: patchmnist
  data_root: data/mnist
  image_size: 256
  digit_size: 32
  grid_size: 20
  num_train: 3000
  num_val: 375
  num_test: 375
  seed: 42
  download: true

pattern_generator:
  mode: learnable_frequency
  num_patterns: 8
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42

sigmoid_schedule:
  epoch_baseline: 0
  epoch_cutoff: 0
  epoch_step: 1
  m_init: 1.0

forward_model:
  downscale_factor: 8
  use_impulse_psfs: true
  ex_psf_kernel_size: 3
  em_psf_kernel_size: 3

detector_noise:
  mode: differentiable_poisson_plus_read
  noise_normalization: paper_v3
  photon_count: 10000.0
  gamma_background: 10.0
  gamma: 10.0
  sigma_read: 0.0
  apply_noise: true

inverse_model:
  upsampling:
    mode: locality_aware
    downscale_factor: 8
    num_patterns: 8
    use_mixing_cnn: false
    mixing_hidden_channels: 16
  reconstruction:
    in_channels: 8
    hidden_channels: [64, 64, 32, 32, 16, 1]
    kernel_size: 3
    padding: 1

training:
  batch_size: 32
  log_every: 500
  paper_illumination_lr: 1.0
  stable_illumination_lr: 0.3
  illumination_lr: 1.0
  inverse_lr: 0.001
  gradient_clip_norm: 1.0
  sharpen_eval_m: 10.0
  loss: l1
  learn_patterns: true
  max_steps: 7350
  fixed_sigmoid_m: 1.0
  staged_hardening:
    inverse_warmup_steps: 3000
    joint_soft_steps: 7350
    harden_m_values: [2, 4, 8]
    harden_steps_per_m: 1500
