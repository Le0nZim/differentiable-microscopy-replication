# Paper-aligned fixed-pattern baseline matrix (Fig. 3 pattern types).
# Base: paper_aligned_patchmnist_x8.yaml (illumination_lr 1.0 after LR gate adoption).

base_config: paper_aligned_patchmnist_x8.yaml
results_csv: experiments/content_aware/fixed_baselines/results.csv

experiments:
  - run_id: patchmnist_x8_random_locality
    notes: paper_aligned_random_fixed_locality
    overrides:
      pattern_generator:
        mode: random_fixed
      inverse_model:
        upsampling:
          mode: locality_aware
      training:
        learn_patterns: false
        use_staged_hardening: false

  - run_id: patchmnist_x8_uniform_locality
    notes: paper_aligned_uniform_all_ones_locality
    overrides:
      pattern_generator:
        mode: uniform_all_ones
      inverse_model:
        upsampling:
          mode: locality_aware
      training:
        learn_patterns: false
        use_staged_hardening: false

  - run_id: patchmnist_x8_hadamard_locality
    notes: paper_aligned_hadamard_fixed_locality
    overrides:
      pattern_generator:
        mode: hadamard_fixed
      inverse_model:
        upsampling:
          mode: locality_aware
      training:
        learn_patterns: false
        use_staged_hardening: false

  - run_id: patchmnist_x8_random_transpose
    notes: paper_aligned_random_fixed_transpose_mechanism
    overrides:
      pattern_generator:
        mode: random_fixed
      inverse_model:
        upsampling:
          mode: transpose_conv
      training:
        learn_patterns: false
        use_staged_hardening: false

  - run_id: patchmnist_x8_uniform_transpose
    notes: paper_aligned_uniform_transpose_mechanism
    overrides:
      pattern_generator:
        mode: uniform_all_ones
      inverse_model:
        upsampling:
          mode: transpose_conv
      training:
        learn_patterns: false
        use_staged_hardening: false

  - run_id: patchmnist_x8_hadamard_transpose
    notes: paper_aligned_hadamard_transpose_mechanism
    overrides:
      pattern_generator:
        mode: hadamard_fixed
      inverse_model:
        upsampling:
          mode: transpose_conv
      training:
        learn_patterns: false
        use_staged_hardening: false
