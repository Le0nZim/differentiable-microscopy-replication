# Task-aware segmentation on the BBBC022 Hoechst substitute (paper §5.3 / B.0.1).
#
# This is a BBBC022 SUBSTITUTE proxy for the paper's U2OS task-aware experiment;
# the original U2OS data are unavailable. The runner
# (scripts/figure04_segmentation/train_stage1_frozen.py) deep-merges per-cell overrides
# for the {x64, x256, x1024} x {fixed pseudo-random, learnable} matrix; the
# values below are the x64 learnable template.

experiment:
  seed: 42
  device: cuda:1
  study_label: "BBBC022 task-aware segmentation (paper B.0.1 proxy; not U2OS)"
  results_csv: experiments/figure04_segmentation/stage1_frozen/stage1_results.csv
  run_id: taskaware_x64_learnable_frequency
  output_dir: experiments/figure04_segmentation/stage1_frozen/taskaware_x64_learnable_frequency_seed42

dataset:
  name: bbbc022_hoechst
  data_root: data/substitute_data
  stack_glob: "**/*.tif"
  preprocessing_mode: paper_strict
  bias: 134.28
  clip_max: 500.0
  downscale_factor: 1.0
  background_percentile: 1.0
  clip_percentile: 99.9
  patch_size: 256
  image_size: 256
  num_train_images: 168
  num_val_images: 21
  num_test_images: 21
  seed: 42
  train_random_crops: true
  random_flips: true
  split_by_well: true
  return_mask: true
  # Pseudo-ground-truth mask generation (paper supplement A.2.3): normalize to
  # [0,1] -> threshold 0.3 -> morphological closing with a (10,10) kernel.
  mask_threshold: 0.3
  mask_closing_kernel: 10

pattern_generator:
  mode: learnable_frequency        # overridden to random_fixed for the fixed cells
  num_patterns: 4                  # T (compression = downscale^2 / T)
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42

sigmoid_schedule:
  epoch_baseline: 0
  epoch_cutoff: 0
  epoch_step: 1
  m_init: 1.0

forward_model:
  downscale_factor: 16             # x64 (16^2/4). 32 -> x256, 64 -> x1024
  use_impulse_psfs: true
  ex_psf_kernel_size: 3
  em_psf_kernel_size: 3

detector_noise:
  mode: noise_free
  photon_count: 10000.0
  gamma: 10.0
  sigma_read: 0.0
  apply_noise: false

inverse_model:
  upsampling:
    mode: locality_aware
    downscale_factor: 16
    num_patterns: 4
    use_mixing_cnn: false
    mixing_hidden_channels: 16
  reconstruction:
    in_channels: 4
    hidden_channels: [64, 64, 32, 32, 16, 1]
    kernel_size: 3
    padding: 1

# Small convolutional segmentation network appended to the reconstruction
# (paper B.0.1 step 2). Emits raw 1-channel logits (no activation).
segmentation_head:
  in_channels: 1
  hidden_channels: [16, 16, 1]
  kernel_size: 3
  padding: 1

training:
  batch_size: 32
  log_every: 200
  illumination_lr: 1.0
  inverse_lr: 0.001
  gradient_clip_norm: 1.0
  sharpen_eval_m: 10.0
  loss: l1
  learn_patterns: true             # overridden to false for the fixed cells
  fixed_sigmoid_m: 1.0

  # Task-aware segmentation loss weights (read by the staged trainer).
  seg_bce_weight: 1.0              # main BCEWithLogits task loss
  seg_dice_weight: 0.5            # auxiliary soft-Dice
  reconstruction_l1_weight: 0.0   # optional Stage-3 stabilizer (off by default)

  task_aware:
    stage1_mode: train             # "train" runs Stage 1 fresh; "load" reuses content_aware_checkpoint
    content_aware_checkpoint: null
    eval_sigmoid_m: 10.0           # sharpened (near-binary) patterns for evaluation
    # Stage-3 illumination finetuning soft->hard schedule. The soft phase lets the
    # segmentation loss flow into the frequency-domain pattern parameters; the
    # hardening tail re-binarizes them for evaluation (same discipline as the
    # content-aware schedule).
    finetune_sigmoid_m: 1.0
    finetune_harden_m_values: [2.0, 4.0, 8.0]
    finetune_soft_fraction: 0.6
    seg_head_lr: 0.001
    num_qualitative_samples: 6
    # Stage 1: content-aware reconstruction pretraining
    stage1:
      learnable:                   # staged-hardening schedule for learnable illumination
        inverse_warmup_steps: 1500
        joint_soft_steps: 3500
        harden_m_values: [2, 4, 8]
        harden_steps_per_m: 800
      fixed_steps: 4000            # fixed pseudo-random: inverse-only reconstruction steps
    # Stage 2: segmentation-head-only (microscope frozen)
    seg_head_steps: 1200
    # Stage 3: end-to-end task-aware finetuning
    finetune_steps: 2500
