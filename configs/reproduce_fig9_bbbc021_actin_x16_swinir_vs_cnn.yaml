# Fig. 9 (HumanMCF7, x16): Ground Truth / wSwinIR / wCNN (+ learned H_t).
# Channel: ACTIN (w4) -- COMPARISON variant only; the paper uses channel-2 == Tubulin.
# Requires extracting actin (w4) images first via tools/audit_bbbc021_channels.py.

experiment:
  seed: 42
  fixed_seed: true
  deterministic_eval: true
  tag: reproduce_fig9_bbbc021_actin_x16_swinir_vs_cnn
  label: "Fig.9 HumanMCF7 x16 wSwinIR vs wCNN(64), ACTIN (comparison only)"

dataset_name: BBBC021
cell_type: HumanMCF7
compression: 16
learned_Ht: true
frequency_domain_optimization: true
custom_sigmoid_schedule: true
swinir_upscale: 1
deterministic_eval: true
fixed_seed: true

dataset:
  name: mcf7_channel2
  dataset_name: BBBC021
  cell_type: HumanMCF7
  bbbc021_channel: actin              # w4 == Actin (COMPARISON only; paper uses tubulin)
  data_root: data/mcf7_bbbc021
  images_dir: channel4_actin
  manifest_csv: manifests/mcf7_channel2_manifest.csv
  image_metadata_csv: raw_zips/BBBC021_v1_image.csv
  patch_size: 256
  image_size: 256
  num_train: 3000
  num_val: 100
  num_test: 100
  seed: 42
  split_by_well: true
  train_random_crops: true
  random_flips: true

pattern_generator:
  mode: learnable_frequency
  num_patterns: 4
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42
  superpixel_factor: 1   # FULL-RES patterns (paper Fig 9 = fine speckle). sp=8 forced hard 8px blocks.

forward_model:
  downscale_factor: 8
  use_impulse_psfs: true

detector_noise:
  mode: noise_free
  apply_noise: false

inverse_model:
  upsampling:
    mode: locality_aware
    downscale_factor: 8
    num_patterns: 4

swinir:
  upscale: 1
  in_chans: 1
  img_size: 256
  window_size: 8
  upsampler: ""
  embed_dim: 180
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  resi_connection: "1conv"
  img_range: 1.0
  use_checkpoint: true

algorithm1:
  epochs: 230
  epoch_baseline: 150
  epoch_cutoff: 150
  epoch_step: 20
  m_values: [2, 4, 8]

training:
  micro_batch_size: 2
  grad_accum: 4
  conv_batch_size: 8
  illumination_lr: 0.1
  swinir_lr: 0.0002
  disc_lr: 0.0002
  betas: [0.9, 0.99]
  inverse_lr: 0.001
  amp_dtype: bfloat16
  eval_sigmoid_m: 8.0
  gan_warmup_epochs: null
  checkpoint_selection: max_val_ssim
  loss:
    pixel_weight: 1.0
    pixel_kind: l1
    perceptual_weight: 1.0
    gan_weight: 0.1
    gan_type: vanilla
    vgg_weights_available: true
    in_chans: 1

wcnn:
  image_size: 64

reproduce:
  figure: 9
  runs_dir: experiments/figure89_mcf7_actin_x16/runs   # separate actin run dir (train first)
  conditions: [wswinir, wcnn64]           # wSwinIR, wCNN(64)
  eval_sigmoid_m: 8.0
  tile_overlap_frac: 0.25
  consistent_display_norm: true
  fig9_src_index: 0
  fig9_top: 384
  fig9_left: 0
  fig9_height: 256
  fig9_width: 1280
