# Figure 10 / Table 3 ablation (paper §5.7) reproduced on the SAME BBBC022 Hoechst
# substitute dataset + preprocessing + split that the repo's Figure 3 reproduction
# uses (see experiments/figure03_content_aware/).
#
# This is NOT the paper's U2OS data (unavailable; see
# experiments/table03_ablation/U2OS_DATA_STATUS.md). The BBBC022
# Hoechst nuclei substitute is the same stand-in the repo uses for the U2OS-based
# Figure 3 experiment, per the user's instruction to "use the substitute data
# figure 3 is using".
#
# Paper Fig 10 / Table 3 conditions (x16 == d=8, T=4; L1; conventional ReconCNN):
#   A: fixed H_t (random_fixed)      + transpose-conv upsampling + freq-domain opt
#   B: learnable_frequency H_t       + transpose-conv upsampling + freq-domain opt
#   C: learnable_frequency H_t       + locality-aware upsampling + freq-domain opt  (paper best)
#   D: learnable_spatial   H_t       + locality-aware upsampling + NO freq-domain opt
# The A/B/C/D variant knobs (pattern_generator.mode, inverse_model.upsampling.mode,
# training.learn_patterns) are applied by scripts/figure10_ablation/train.py via the
# SAME validated apply_variant() used for the audited AM-3 ablation. This base file
# encodes the shared (variant-invariant) settings; the values below correspond to
# variant C defaults.

experiment:
  seed: 42
  device: cuda:0
  study_label: "Figure 10 ablation on BBBC022 Hoechst substitute (Fig-3 data); NOT paper U2OS"
  results_csv: experiments/figure10_ablation/results.csv
  compression: 16.0

dataset:                              # == the exact substitute data Fig 3 uses
  name: bbbc022_preproc_ablation
  data_root: data/substitute_data
  stack_glob: "**/*.tif"
  # Fig-3 well-disjoint split (train 1980 / val 40 / test 60 images).
  split_path: configs/_shared/splits/split_fig03_large.json
  repo_root: .
  preproc_mode: minimal_percentile   # Fig-3 preprocessing (per-image robust percentile clip)
  q_low: 0.001
  q_high: 0.999
  patch_size: 256
  image_size: 256
  train_random_crops: true
  random_flips: true
  epoch_varying_train_crops: true    # true augmentation (Fig-3 content-aware setting)
  seed: 42
  return_mask: false

pattern_generator:
  mode: learnable_frequency           # (variant knob) C default
  num_patterns: 4                     # T = 4
  sigmoid_m: 1.0
  random_fixed_m: 10.0
  seed: 42

sigmoid_schedule:
  epoch_baseline: 0
  epoch_cutoff: 0
  epoch_step: 1
  m_init: 1.0

forward_model:
  downscale_factor: 8                 # 8x8:1 -> x16 at T=4
  use_impulse_psfs: true
  ex_psf_kernel_size: 3
  em_psf_kernel_size: 3

detector_noise:
  mode: noise_free
  photon_count: 10000.0
  gamma: 10.0
  sigma_read: 0.0
  apply_noise: false

inverse_model:
  upsampling:
    mode: locality_aware              # (variant knob) C default
    downscale_factor: 8
    num_patterns: 4
    use_mixing_cnn: false
    mixing_hidden_channels: 16
  reconstruction:
    in_channels: 4
    hidden_channels: [64, 64, 32, 32, 16, 1]
    kernel_size: 3
    padding: 1

training:
  batch_size: 32                      # paper §4.4.3
  log_every: 200
  illumination_lr: 1.0                # paper illumination lr
  inverse_lr: 0.001                   # paper inverse lr
  gradient_clip_norm: 1.0
  sharpen_eval_m: 10.0
  loss: l1
  learn_patterns: true                # (variant knob) C default
  fixed_sigmoid_m: 1.0
  # Uniform scaled Algorithm-1 phases are supplied by the runner (default_phases):
  #   inverse_warmup 1500 (illum frozen, m=1) -> joint_soft 4000 (m=1)
  #   -> harden m=2 (1000) -> m=4 (1000) -> m=8 (1000).  Identical for A/B/C/D.
  staged_hardening:
    inverse_warmup_steps: 1500
    joint_soft_steps: 4000
    harden_m_values: [2, 4, 8]
    harden_steps_per_m: 1000

deviations_from_paper:
  - "DATA: BBBC022 Hoechst nuclei SUBSTITUTE (same stand-in as repo Fig 3), NOT paper U2OS (unavailable). Fig-3 split_fig03_large well-disjoint 1980/40/60."
  - "PREPROC: minimal_percentile (per-image q0.1-99.9 clip + minmax) == Fig-3 preprocessing (not the aggressive U2OS bias/clip500 pipeline)."
  - "BUDGET: scaled Algorithm-1 (8500 steps, uniform across A/B/C/D) instead of paper's full U2OS 12150+12150-epoch schedule; global best-val checkpoint selection."
  - "NUMERIC: Table-3 SSIM/MSE magnitudes are NOT comparable to paper U2OS (different data). Only the A/B/C/D ordering is meaningful here."
